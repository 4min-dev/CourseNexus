# IMPORTANT:
# 1) Keep upstream in separate file managed by scripts:
#    /etc/nginx/conf.d/vkurse-upstream.conf
# 2) That file should contain:
#    upstream coursenexus_backend {
#        server 127.0.0.1:5000;   # legacy before cutover, then 5001/5002
#        keepalive 64;
#    }

server {
    server_name vkurse.io;
    client_max_body_size 1024M;

    location / {
        proxy_pass http://coursenexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vkurse.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkurse.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name vkurse.io;
    return 301 https://$host$request_uri;
}
